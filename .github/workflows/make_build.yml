# For syntax, see https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# Builds all supported platforms on demand or when a version tag is pushed.

name: Make a GDExtension build for all supported platforms
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # A build is made for every possible combination of parameters
        # You can add or remove entries from the arrays of each parameter to customize which builds you want to run.
        # See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-22.04 },
            { platform: linux, arch: arm64, os: ubuntu-22.04-arm },
            { platform: windows, arch: x86_64, os: ubuntu-22.04 },
            { platform: windows, arch: arm64, os: ubuntu-22.04 },
            { platform: macos, arch: universal, os: macos-latest },
            { platform: android, arch: x86_64, os: ubuntu-22.04 },
            { platform: android, arch: arm64, os: ubuntu-22.04 },
            { platform: ios, arch: arm64, os: macos-latest },
            { platform: web, arch: wasm32, os: ubuntu-22.04 },
          ]
        target-type: [template_debug, template_release]
        float-precision: [single, double]

    runs-on: ${{ matrix.target.os }}
    steps:
      # Clone this repository
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # Add linux x86_32 toolchain
      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Install LLVM-MinGW cross-compilers
        if: ${{ matrix.target.platform == 'windows' }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          archive="$RUNNER_TEMP/llvm-mingw.tar.xz"
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64.tar.xz -o "$archive"
          echo "919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926  $archive" | sha256sum --check
          tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP/llvm-mingw"
          echo "MINGW_PREFIX=$RUNNER_TEMP/llvm-mingw" >> "$GITHUB_ENV"

      # Setup dependencies
      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          # LLVM-MinGW was installed above; skip the action's GCC MinGW setup.
          windows-compiler: msvc
          em-version: 3.1.62

      # Build GDExtension (with caches)

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Build GDExtension Debug Build
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }} ${{ matrix.target.platform == 'web' && 'threads=no' || '' }} ${{ matrix.target.platform == 'windows' && 'use_llvm=yes' || '' }}

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      # Clean up compilation files
      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: bash
        run: |
          find bin -type f \( -name '*.exp' -o -name '*.lib' -o -name '*.a' -o -name '*.pdb' \) -delete

      # Upload the build
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: godot-vgmstream-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}
          path: |
            ${{ github.workspace }}/bin/**

  # Merges all the build artifacts together into a single godot-vgmstream artifact.
  # If you comment out this step, all the builds will be uploaded individually.
  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: godot-vgmstream
          pattern: godot-vgmstream-*
          delete-merged: true

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    needs: merge
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate version tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid vMAJOR.MINOR.PATCH version." >&2
            exit 1
          fi

          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download merged build
        uses: actions/download-artifact@v7
        with:
          name: godot-vgmstream
          path: release-files

      - name: Package release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp project/bin/godot-vgmstream.gdextension release-files/
          cd release-files
          zip -r "$RUNNER_TEMP/godot-vgmstream-${TAG}.zip" .

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          args=(--draft --verify-tag --generate-notes --title "$TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "$RUNNER_TEMP/godot-vgmstream-${TAG}.zip" "${args[@]}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
